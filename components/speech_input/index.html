<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }

  #btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #8b95a5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  #btn:hover { background: rgba(120,130,145,0.15); color: #5b6472; }
  #btn svg { width: 18px; height: 18px; display: block; }

  #btn.listening {
    background: rgba(224,82,82,0.15);
    color: #e05252;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.55; }
  }
  #btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<button id="btn" title="Speak">
  <!-- microphone icon -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
    <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
    <line x1="12" y1="18" x2="12" y2="22"/>
  </svg>
</button>

<script>
  // ── Streamlit component handshake ─────────────────────────────────────────
  function sendMessage(type, data = {}) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type, ...data },
      "*"
    );
  }
  function sendValue(value) {
    sendMessage("streamlit:setComponentValue", { value, dataType: "json" });
  }
  sendMessage("streamlit:componentReady", { apiVersion: 1 });
  sendMessage("streamlit:setFrameHeight", { height: 38 });

  // ── Elements ──────────────────────────────────────────────────────────────
  const btn = document.getElementById("btn");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    btn.disabled = true;
    btn.title = "Voice input needs Chrome or Edge";
  } else {

    // ── Transcript state ──────────────────────────────────────────────────
    // committed   = finalized text from sessions that have already ended
    // sessionFinal= finalized text within the CURRENT recognition session
    // interim     = not-yet-finalized text in the current session
    // Chrome restarts the recognition session on every pause, so we persist
    // `committed` across restarts and never rely on result-index deltas.
    let recognition  = null;
    let isRecording  = false;
    let committed    = "";
    let sessionFinal = "";
    let interim      = "";

    function join(a, b) {
      b = (b || "").trim();
      if (!b) return a;
      return a ? a + (a.endsWith(" ") ? "" : " ") + b : b;
    }
    function fullText() {
      return join(join(committed, sessionFinal), interim).trim();
    }

    function initRecognition() {
      recognition = new SR();
      recognition.continuous      = true;
      recognition.interimResults  = true;
      recognition.maxAlternatives = 1;
      recognition.lang            = "en-US";

      recognition.onresult = e => {
        // rebuild the current session's text from scratch each event
        sessionFinal = "";
        interim      = "";
        for (let i = 0; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) sessionFinal = join(sessionFinal, t);
          else                      interim      = join(interim, t);
        }
      };

      // Chrome ends the session on its own after a pause. Commit this session's
      // finalized text, then restart so recording stays continuous until the
      // user clicks the mic again to stop.
      recognition.onend = () => {
        committed    = join(committed, sessionFinal);
        sessionFinal = "";
        interim      = "";
        if (isRecording) {
          try { recognition.start(); } catch {}
        }
      };

      recognition.onerror = e => {
        if (e.error === "no-speech") return;
        if (e.error === "not-allowed") {
          btn.title = "Mic access denied";
          stopUI();
          isRecording = false;
        }
      };
    }

    function startUI() {
      btn.classList.add("listening");
      btn.title = "Listening… click to stop";
    }

    function stopUI() {
      btn.classList.remove("listening");
      btn.title = "Speak";
    }

    function stopAndSend() {
      if (!isRecording) return;
      isRecording = false;
      // Capture everything (committed + current session final + interim) BEFORE
      // stopping, so the last words spoken are never dropped.
      const final = fullText();
      try { recognition.stop(); } catch {}
      stopUI();
      sendValue(final || null);
    }

    btn.addEventListener("click", () => {
      if (isRecording) {
        stopAndSend();
      } else {
        if (!recognition) initRecognition();
        committed    = "";
        sessionFinal = "";
        interim      = "";
        isRecording  = true;
        sendValue(null);  // clear previous value on Streamlit side
        startUI();
        try { recognition.start(); } catch(e) { console.warn(e); }
      }
    });
  }
</script>
</body>
</html>
